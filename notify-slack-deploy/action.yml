name: "Notify Slack Deploy"
description: "Send deploy notification to Slack with properly escaped user content"

inputs:
  token:
    description: "Slack bot token"
    required: true
  channel_id:
    description: "Slack channel ID"
    required: true
  header:
    description: "Header text for the message"
    required: true
  environment:
    description: "Deployment environment name shown in the header, e.g. prod or stg. Non-prod success uses 🟡 instead of ✅."
    required: false
    default: ""
  result:
    description: "'success' or 'failure'"
    required: true
  pr_url:
    description: "PR URL"
    required: true
  pr_number:
    description: "PR number"
    required: true
  pr_title:
    description: "PR title"
    required: true
  slack_user_id:
    description: "Slack user ID to mention on failure"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Send Slack notification
      uses: slackapi/slack-github-action@v3
      with:
        method: chat.postMessage
        token: ${{ inputs.token }}
        payload: |
          channel: ${{ inputs.channel_id }}
          blocks:
          - type: header
            text:
              type: plain_text
              text: ${{ toJson(inputs.environment != '' && format('{0} {1}', inputs.header, startsWith(inputs.environment, 'prod') && format('🌍 {0}', inputs.environment) || format('🎭 {0}', inputs.environment)) || inputs.header) }}
          - type: section
            text:
              type: mrkdwn
              text: ${{ inputs.result == 'success' && toJson(format('{0} Deployet <{1}|PR#{2}> - {3}', (inputs.environment == '' || startsWith(inputs.environment, 'prod')) && '✅' || '🟡', inputs.pr_url, inputs.pr_number, inputs.pr_title)) || toJson(format('❌ Deploy feilet for <{0}|PR#{1}> - {2}{3}', inputs.pr_url, inputs.pr_number, inputs.pr_title, inputs.slack_user_id != '' && format(' cc <@{0}>', inputs.slack_user_id) || '')) }}
