name: "Notify Slack Deploy"
description: "Send deploy notification to Slack with properly escaped user content"

inputs:
  token:
    description: "Slack bot token"
    required: true
  channel_id:
    description: "Slack channel ID"
    required: true
  header:
    description: "Prefix text for the message, e.g. service name"
    required: true
  environment:
    description: "Deployment environment name shown in the message, e.g. prod or stg. Non-prod success uses 🟡 instead of 🟢."
    required: false
    default: ""
  result:
    description: "'success' or 'failure'"
    required: true
  pr_url:
    description: "PR URL"
    required: true
  pr_number:
    description: "PR number"
    required: true
  pr_title:
    description: "PR title"
    required: true
  slack_user_id:
    description: "Slack user ID to mention on failure"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Build message
      id: message
      uses: actions/github-script@v9
      env:
        HEADER: ${{ inputs.header }}
        ENVIRONMENT: ${{ inputs.environment }}
        RESULT: ${{ inputs.result }}
        PR_URL: ${{ inputs.pr_url }}
        PR_NUMBER: ${{ inputs.pr_number }}
        PR_TITLE: ${{ inputs.pr_title }}
        SLACK_USER_ID: ${{ inputs.slack_user_id }}
      with:
        result-encoding: string
        script: |
          const { HEADER, ENVIRONMENT, RESULT, PR_URL, PR_NUMBER, PR_TITLE, SLACK_USER_ID } = process.env
          // Slack mrkdwn treats &, < and > as control characters
          const escape = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

          const name = escape(ENVIRONMENT ? `${HEADER} (${ENVIRONMENT})` : HEADER)
          const pr = `<${PR_URL}|#${PR_NUMBER}>: ${escape(PR_TITLE)}`

          if (RESULT === 'success') {
            const emoji = !ENVIRONMENT || ENVIRONMENT.startsWith('prod') ? '🟢' : '🟡'
            return `${emoji} *Deployet ${name}*\n${pr}`
          }
          const cc = SLACK_USER_ID ? ` cc <@${SLACK_USER_ID}>` : ''
          return `🚨 *Deploy feilet for ${name}*\n${pr}${cc}`

    - name: Send Slack notification
      uses: slackapi/slack-github-action@v4
      with:
        method: chat.postMessage
        token: ${{ inputs.token }}
        payload: |
          channel: ${{ inputs.channel_id }}
          unfurl_links: false
          blocks:
          - type: section
            text:
              type: mrkdwn
              text: ${{ toJson(steps.message.outputs.result) }}
