name: "Notify Slack Deploy"
description: "Send deploy notification to Slack with properly escaped user content"

inputs:
  token:
    description: "Slack bot token"
    required: true
  channel_id:
    description: "Slack channel ID"
    required: true
  environment:
    description: "Deployment environment name shown in the message, e.g. prod or stg. Non-prod success uses 🟡 instead of 🟢."
    required: false
    default: ""
  result:
    description: "'success' or 'failure'"
    required: true
  pr_url:
    description: "PR URL"
    required: true
  pr_number:
    description: "PR number"
    required: true
  pr_title:
    description: "PR title"
    required: true
  slack_user_id:
    description: "Slack user ID to mention on failure"
    required: false
    default: ""
  context:
    description: "Optional text shown in a context block below the message, e.g. the list of deployed services"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Build message
      id: message
      uses: actions/github-script@v9
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        RESULT: ${{ inputs.result }}
        PR_URL: ${{ inputs.pr_url }}
        PR_NUMBER: ${{ inputs.pr_number }}
        PR_TITLE: ${{ inputs.pr_title }}
        SLACK_USER_ID: ${{ inputs.slack_user_id }}
        CONTEXT: ${{ inputs.context }}
      with:
        result-encoding: string
        script: |
          const { ENVIRONMENT, RESULT, PR_URL, PR_NUMBER, PR_TITLE, SLACK_USER_ID, CONTEXT } = process.env
          // Slack mrkdwn treats &, < and > as control characters
          const escape = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

          const subject = `<${PR_URL}|#${PR_NUMBER}>: ${escape(PR_TITLE)}`

          let text
          if (RESULT === 'success') {
            const icon = !ENVIRONMENT || ENVIRONMENT.startsWith('prod') ? '🟢' : '🟡'
            text = `${icon} ${subject}`
          } else {
            const cc = SLACK_USER_ID ? ` cc <@${SLACK_USER_ID}>` : ''
            text = `🚨 *Deploy feilet:* ${subject}${cc}`
          }

          const blocks = [{ type: 'section', text: { type: 'mrkdwn', text } }]
          if (CONTEXT) {
            blocks.push({ type: 'context', elements: [{ type: 'mrkdwn', text: escape(CONTEXT) }] })
          }
          return JSON.stringify(blocks)

    - name: Send Slack notification
      uses: slackapi/slack-github-action@v4
      with:
        method: chat.postMessage
        token: ${{ inputs.token }}
        payload: |
          channel: ${{ inputs.channel_id }}
          unfurl_links: false
          blocks: ${{ steps.message.outputs.result }}
