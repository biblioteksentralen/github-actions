name: Backup
description: Backup Sanity dataset
inputs:
  sanity-read-token:
    description: "Sanity token with Viewer role, used to export dataset"
    required: true
  dataset-name:
    description: "Name of the dataset to back up"
    required: false
    default: "production"
  sanity-path:
    description: "Path to the Sanity folder within the repo"
    required: false
    default: "."
  package-manager:
    description: "The package manager used in the repo, either'npm' or 'pnpm'"
    required: false
    default: pnpm
  node-version:
    description: "NodeJS version"
    required: false
    default: "22"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - if: inputs.package-manager == 'pnpm'
      uses: biblioteksentralen/github-actions/node-pnpm-setup@v1
      with:
        node-version: ${{ inputs.node-version }}
    - if: inputs.package-manager == 'npm'
      uses: biblioteksentralen/github-actions/node-npm-setup@v1
      with:
        node-version: ${{ inputs.node-version }}
    - name: Remove unecessary packages before backup to save space
      run: |
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android
        df -h
    - name: Determine retention period
      shell: bash
      run: |
        if [ $(date '+%A') == 'Saturday' ]; then
          if [ $(date '+%d') -le 8 ]; then
            # 1st saturday of the month
            echo "RETENTION_DAYS=90" >> $GITHUB_ENV
          else
            # Saturday but not 1st in the month
            echo "RETENTION_DAYS=45" >> $GITHUB_ENV
          fi
        else
          # Non-saturday
          echo "RETENTION_DAYS=14" >> $GITHUB_ENV
        fi
    - name: Determine backup file name
      shell: bash
      run: |
        echo "BACKUP_FILE_NAME=backup-${{ inputs.dataset-name }}-$(date +%Y-%m-%d).tar.gz" >> $GITHUB_ENV
    - name: Export dataset
      shell: bash
      working-directory: ${{ inputs.sanity-path }}
      env:
        SANITY_AUTH_TOKEN: ${{ inputs.sanity-read-token }}
      run: >
        ${{ inputs.package-manager == 'pnpm' && 'pnpm exec' || 'npx' }} sanity dataset export ${{ inputs.dataset-name }} backups/${{ env.BACKUP_FILE_NAME }}
    - name: Upload ${{ env.BACKUP_FILE_NAME }} and store for ${{ env.RETENTION_DAYS }} days
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BACKUP_FILE_NAME }}
        path: ${{ inputs.sanity-path }}/backups/${{ env.BACKUP_FILE_NAME }}
        # Fails the workflow if no files are found; defaults to 'warn'
        if-no-files-found: error
        retention-days: ${{ env.RETENTION_DAYS }}
